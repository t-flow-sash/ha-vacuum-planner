name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.16"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test and security tools
        run: |
          python -m pip install --require-hashes -r requirements-ci.txt
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Run tests with coverage
        run: python -m pytest --cov=custom_components/vacuum_planner --cov-report=term-missing --cov-fail-under=90 -q
      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Run strict mypy
        run: mypy . --strict
      - name: Compile Python
        run: python -m compileall -q custom_components tests
      - name: Validate JSON metadata and translations
        run: |
          python -m json.tool hacs.json >/dev/null
          python -m json.tool custom_components/vacuum_planner/manifest.json >/dev/null
          python -m json.tool custom_components/vacuum_planner/strings.json >/dev/null
          python -m json.tool custom_components/vacuum_planner/translations/de.json >/dev/null
          python -m json.tool custom_components/vacuum_planner/translations/en.json >/dev/null
      - name: Scan Python for common security defects
        run: bandit -q -r custom_components/vacuum_planner

  home-assistant-contract:
    name: Real Home Assistant lifecycle (${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.3.1"
            pytest_plugin: "0.13.317"
          - homeassistant: "2026.9.3"
            pytest_plugin: "0.13.366"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14.4"
      - name: Install pinned Home Assistant test tooling
        run: python -m pip install pytest-homeassistant-custom-component==${{ matrix.pytest_plugin }}
      - name: Verify pinned Home Assistant version
        run: |
          python - <<'PY'
          from importlib.metadata import version
          expected = "${{ matrix.homeassistant }}"
          actual = version("homeassistant")
          if actual != expected:
              raise SystemExit(f"expected Home Assistant {expected}, got {actual}")
          print(f"Home Assistant {actual}")
          PY
      - name: Run lifecycle test
        run: python -m pytest -c tests_ha/pytest.ini tests_ha -q

  hassfest:
    name: Home Assistant structure
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run hassfest
        uses: docker://ghcr.io/home-assistant/hassfest@sha256:d13ffcc8995c1217804fe355ed078a81d3028b7002355bc5d89d19d9075d63c7

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run HACS validation
        uses: docker://ghcr.io/hacs/action@sha256:dc92fdad2f6ffbe74bffb7269d781ea8e064f52d9bb486cdf3925d74e7ab6ebf
        with:
          category: integration
          repository: ${{ github.repository }}
          comment: false
          github_token: ${{ github.token }}
