[build-system]
requires = ["hatchling==1.32.3", "editables==0.6"]
build-backend = "hatchling.build"

[project]
name = "ha-vacuum-planner"
version = "0.1.0-beta.2"
description = "Home Assistant independent domain core for Vacuum Planner"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "editables==0.6",
  "hatchling==1.32.3",
  "mypy==1.18.2",
  "pip==26.2.1",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.2",
  "voluptuous==0.15.2",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/vacuum_planner"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D105",
  "D107",
  "D203",
  "D213",
  "EM101",
  "EM102",
  "PLR0913",
  "TRY003",
  "TRY004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "D", "FBT003", "PLR2004", "S101", "S106"]
"tests_ha/**/*.py" = ["ANN", "D", "FBT003", "PLR2004", "S101", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["custom_components/vacuum_planner", "tests"]

[[tool.mypy.overrides]]
module = ["homeassistant.*", "pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
