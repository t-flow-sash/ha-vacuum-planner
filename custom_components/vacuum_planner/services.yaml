start_next:
  fields:
    config_entry_id: &planner_entry
      required: true
      selector:
        config_entry:
          integration: vacuum_planner

skip_area_today:
  fields:
    config_entry_id: *planner_entry
    area_id: &area_id
      required: true
      selector:
        area:

postpone_area:
  fields:
    config_entry_id: *planner_entry
    area_id: *area_id
    days:
      required: true
      selector:
        number:
          min: 1
          max: 365
          mode: box

cancel_block:
  fields:
    config_entry_id: *planner_entry
    block_id:
      required: true
      selector:
        text:

resolve_uncertain_run:
  fields:
    config_entry_id: *planner_entry
    job_id:
      required: true
      selector:
        text:
    resolution:
      required: true
      selector:
        select:
          options:
            - retry_safe

get_queue:
  fields:
    config_entry_id: *planner_entry
